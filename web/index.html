<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#15100c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>THE ROOMS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Mono:wght@400;500&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="title">
  <canvas id="fx" aria-hidden="true"></canvas>

  <main id="app" class="app">
    <header class="hud">
      <div class="hud-left">
        <div class="label" id="hud-stage">STAGE 01</div>
        <div class="sub" id="hud-world">world 1 · 5×5</div>
      </div>
      <div class="hud-center">
        <div class="label">SCORE</div>
        <div class="score" id="hud-score">0</div>
      </div>
      <div class="hud-right">
        <div class="lives" id="hud-lives" aria-label="Heart"></div>
        <div class="chain" id="hud-chain">×1.0</div>
        <div class="sub time" id="hud-time">0:00</div>
      </div>
    </header>

    <section class="board-wrap" id="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Board"></div>
    </section>

    <section class="companion">
      <div class="portrait-wrap"><canvas id="portrait" width="320" height="400" aria-label="Sterope"></canvas></div>
      <div class="bubble" id="bubble" hidden></div>
    </section>

    <footer class="controls">
      <button class="ctl" id="btn-hint" type="button"><span class="ctl-label">HINT</span><span class="ctl-sub" id="btn-hint-sub">3 left</span></button>
      <button class="ctl" id="btn-clear" type="button"><span class="ctl-label">CLEAR ×</span><span class="ctl-sub">印を消す</span></button>
      <button class="ctl" id="btn-menu" type="button"><span class="ctl-label">MENU</span><span class="ctl-sub">sound · give up</span></button>
    </footer>
  </main>

  <div class="toast" id="toast" hidden></div>
  <div class="overlay" id="overlay" hidden><div class="card" id="overlay-card"></div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
